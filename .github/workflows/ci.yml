name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: Aplicação (typecheck, lint, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      # ANTES do build, e a ordem é o ponto.
      #
      # Tudo que começa com `NEXT_PUBLIC_` é escrito DENTRO do pacote .js que o
      # visitante baixa. Depois do build já seria tarde: o valor estaria nos
      # artefatos, e apagar a variável não o tiraria de lá.
      #
      # O teste unitário prova que a função ACUSA; este passo é a função apontada
      # para o ambiente de verdade. São coisas diferentes — uma guarda que
      # funciona e uma guarda que está montada na porta.
      - name: Nenhum segredo indo para o navegador
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: node --experimental-strip-types scripts/conferir-segredos.ts

      - name: Build de produção
        # Valores de placeholder: nenhuma rota é pré-renderizada com dados reais
        # (todas dependem de cookies ou são force-dynamic), então o build não
        # chega a abrir conexão com o Supabase.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  database:
    name: Banco (migrações, seed, RLS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client

      # Aplica todas as migrações de supabase/migrations em um banco limpo, roda o
      # seed e executa as asserções de RLS com um papel SEM bypassrls.
      # (Sem número aqui de propósito: contagem em comentário envelhece calada.)
      - name: Validar schema e RLS
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run db:validate

      # Backup que nunca foi restaurado é esperança, não backup.
      #
      # O ensaio monta um banco próprio a partir das migrações e do seed, faz o
      # backup, SUJA o banco depois do dump, restaura por cima e confere três
      # coisas: as contagens batem, a linha criada depois do backup sumiu (prova
      # que o banco foi mesmo substituído, e não que o `pg_restore` não fez nada)
      # e as policies de RLS voltaram.
      #
      # Aqui e não num cron anual de sábado: um backup só é confiável enquanto
      # alguém continua provando que ele volta, e o único lugar que não esquece
      # é o CI.
      - name: Ensaio de restauração
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ensaio-de-restauracao.sh

      # E as migrações pelo caminho de PRODUÇÃO, que é outro código: aquele
      # recria o banco do zero, este aplica só o que falta, com livro-razão.
      # Rodá-lo duas vezes prova o que importa — a segunda não pode aplicar nada,
      # senão uma implantação repetida quebraria no primeiro `create table`.
      - name: Migrações pelo caminho de produção, duas vezes
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sti_iarx_ci_producao
        run: |
          bash scripts/migrar.sh
          echo "--- segunda vez: nada pode ser aplicado ---"
          bash scripts/migrar.sh | tee /tmp/segunda.txt
          grep -q '^==> 0 aplicada' /tmp/segunda.txt || {
            echo "ERRO: a segunda execução aplicou migração — o livro-razão não segurou." >&2
            exit 1
          }
