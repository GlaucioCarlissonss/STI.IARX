<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="STI">
  <!--
    Ícone da aba. Não existia nenhum, e o efeito não era só estético: o navegador
    pedia /favicon.ico em TODA navegação, levava 404 e registrava um erro no
    console — ruído permanente que esconde o erro de verdade quando ele aparece.
    Foi o teste de navegador da entrega 5 que encontrou isso.

    SVG em vez de .ico porque escala sem borrar e porque o monograma usa a mesma
