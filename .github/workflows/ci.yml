name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: Aplicação (typecheck, lint, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build de produção
        # Valores de placeholder: nenhuma rota é pré-renderizada com dados reais
        # (todas dependem de cookies ou são force-dynamic), então o build não
        # chega a abrir conexão com o Supabase.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  database:
    name: Banco (migrações, seed, RLS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client

      # Aplica as 12 migrações em um banco limpo, roda o seed e executa as
      # asserções de RLS com um papel SEM bypassrls.
      - name: Validar schema e RLS
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run db:validate
